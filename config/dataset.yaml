# Open dataset export (`etfp export dataset`, src/etfp/export_dataset.py, DECISIONS D34).
#
# This file decides, table by table and column by column, what may leave the project in the
# public dataset. It is deliberately explicit:
#
# * Only the tables listed under `tables:` are exported. A new clean table is NOT exported
#   until someone adds it here.
# * Every column of an exported table must be named here: under the table's `columns`
#   (exported), its `drop` (left out for a non-licence reason) or `deny` below (left out for
#   licence reasons). A column that is in none of them stops the export with an error, so a
#   new column can never leak into the public files by default.
# * `deny` is checked again on the finished files. If a denied table, column, row or a
#   Bloomberg/Yahoo lineage path is found in the output, the export fails and the folder is
#   not written.
#
# Publishing (upload, DOI, licence choice) is Amish's decision. The export only writes a
# local folder under exports/dataset/ (gitignored).

dataset_format_version: "1.0.0"
title: "India-listed international ETF premiums: daily panel"

# Where the numbers come from and whether we know we may republish them.
#   own_work   = computed or written by this project (the owner picks the licence)
#   unverified = redistribution terms not checked yet; the owner must confirm before publishing
licence_status_values: [own_work, unverified]
sources:
  project:
    name: "This project (config files, hand-written events, calculations from the inputs below)"
    licence_status: own_work
    note: "Formulas, flags and config are the project's own work."
  nse:
    name: "National Stock Exchange of India (bhavcopy, UDiFF, security master price bands and units, SLB files, ETF list file, ETF iNAV API)"
    licence_status: unverified
    note: "Free public downloads from nseindia.com / nsearchives. NSE's website terms limit reproduction and commercial use; whether a cleaned derived panel may be republished is not confirmed."
  bse:
    name: "BSE Ltd (daily equity bhavcopy)"
    licence_status: unverified
    note: "Free public download from bseindia.com. Redistribution terms not checked."
  amfi:
    name: "Association of Mutual Funds in India (daily NAV files, NAV history)"
    licence_status: unverified
    note: "Free public download from amfiindia.com. Redistribution terms not checked."
  amc_inav:
    name: "Asset management company websites (intraday iNAV pages)"
    licence_status: unverified
    note: "Recorded every 15 minutes by this project; no public archive exists. Each AMC's site terms not checked."
  amc_disclosures:
    name: "AMC monthly disclosures and factsheets (AUM, fund-of-funds holdings), entered by hand"
    licence_status: unverified
    note: "Public documents; redistribution of the extracted figures not checked."
  google_trends:
    name: "Google Trends (search interest, pulled by hand)"
    licence_status: unverified
    note: "Google's terms for republishing Trends numbers not checked."

deny:
  # Sources whose data may never be in the open dataset (licence forbids redistribution).
  sources:
    bloomberg: "Bloomberg terminal licence forbids redistribution of Bloomberg data and anything derived from it (CLAUDE.md)."
    yahoo: "Yahoo Finance terms forbid redistribution; it is the free fallback for the same futures/FX inputs."
  tables:
    china_etf_daily: "Bloomberg data (R17, D31)."
    underlying_daily: "Futures closes from Bloomberg or Yahoo."
    fx_daily: "USD/INR and HKD/INR rates from Bloomberg or Yahoo."
  # Any table whose name matches one of these (case-insensitive regex) is refused.
  table_patterns: ["bloomberg", "bbg", "yahoo", "china"]
  # Columns refused in a specific table, with the reason.
  columns:
    etf_day:
      fv: "Fair value moves the NAV with Bloomberg (else Yahoo) futures and FX (SPEC 6.2)."
      fv_method: "Labels which licensed source fv used; meaningless without fv."
      fv_futures_ratio: "Bloomberg/Yahoo futures ratio."
      fv_fx_ratio: "Bloomberg/Yahoo FX ratio."
      fv_in_nav_a: "Part of the fair-value input block."
      fv_in_futures_t: "Bloomberg/Yahoo futures price."
      fv_in_futures_a: "Bloomberg/Yahoo futures price."
      fv_in_fx_t: "Bloomberg/Yahoo FX rate."
      fv_in_fx_a: "Bloomberg/Yahoo FX rate."
      fv_input_files: "Names Bloomberg/Yahoo raw files."
      fv_beta: "Beta fair value from Bloomberg/Yahoo futures (R12)."
      fv_beta_value: "Estimated from Bloomberg/Yahoo futures."
      fv_beta_se: "Estimated from Bloomberg/Yahoo futures."
      fv_beta_n: "Part of the beta estimate."
      fv_beta_method: "Part of the beta estimate."
      prem_fv: "close / fv - 1 (uses fv)."
      log_prem_fv: "ln(close / fv) (uses fv)."
      pi: "Alias of log_prem_fv (uses fv)."
      x_april_fv: "Uses fv."
      cap_pi: "ln(official upper limit / fv) (uses fv)."
      cap_pi_computed: "ln(computed upper limit / fv) (uses fv)."
      ret_fv_1: "Return of fv."
      rationed: "Defined on pi, which uses fv."
      dq_prem_fv_extreme: "Flag computed from prem_fv."
      dq_prem_fv_jump: "Flag computed from prem_fv."
      dq_fv_far_from_nav: "Flag computed from fv and futures."
  # Any column in any table whose name matches one of these (case-insensitive regex) is
  # refused, so a new fair-value or futures column is dropped even before it is listed above.
  column_patterns: ["(^|_)fv(_|$)", "futures", "bloomberg", "bbg", "yahoo", "china"]
  # Rows refused: table -> column -> values. These rows are removed, then checked again.
  rows:
    limit_day:
      obs_source: ["bloomberg_1m"]  # minutes-at-limit etc. measured on Bloomberg minute bars
  # Lineage columns (name contains "source" or ends in "_files") must not name these raw folders.
  lineage_substrings: ["bloomberg", "yahoo"]

tables:
  etf_day:
    from: clean
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, amfi, bse, amc_disclosures, google_trends, project]
    description: "One row per ETF per NSE trading day: prices, NAV timing, NAV-based premiums, price bands and limit flags, units outstanding, turnover."
    columns: [
      symbol, date, underlying_market, asset_class, group_label, open, high, low, close, last,
      avg_price, prev_close, close_raw, high_raw, low_raw, last_raw, price_adj_factor, volume,
      value, trades, deliv_qty, deliv_pct, deliv_share, avg_trade, source_file, nav_same_date,
      nav_known_at_close, nav_known, nav_known_date, nav_known_underlying_date,
      nav_publication_lag_days, nav_t2_date, nav_t2_nav_date, nav_t2, nav_t1, nav_adj_factor,
      nav_same_source_file, nav_known_source_file, prem_raw, prem_nav_known, prem_known,
      prem_band_ref, x_april, regime, band_base_kind, band_base_price, band_low_initial,
      band_high_initial, band_low_max, band_high_max, hit_up, hit_up_max, last_at_up, hit_down,
      hit_down_max, last_at_down, widened_up, widened_down, widenings_min_up,
      widenings_min_down, close_at_upper, close_at_lower, band_low_official, band_high_official,
      band_low, band_high, band_file_date, band_session_date, band_source_file, band_low_diff,
      band_high_diff, band_mismatch, hit_up_official, hit_down_official, regime_inferred,
      regime_inferred_method, units_outstanding, units_file_date, units_stale_days,
      units_source_file, units, units_source, units_change, creation_units_change,
      creation_event, creation_multiple_ok, units_change_days_since_prev, bse_close, bse_volume,
      bse_value, bse_trades, turnover_nse, turnover, turnover_is_nse_only, feeder_units,
      feeder_units_asof, float_net, excess_rupees, ret_close_1, ret_close_5, ret_own_1,
      ret_own_5, ret_nav_1, attention, dq_duplicate_row, dq_negative_units, dq_missing_close,
      dq_missing_nav_known, dq_nav_stale, dq_nav_same_date_missing, dq_nav_t2_missing,
      dq_units_aum_mismatch,
    ]
    drop: {}

  etf_master:
    from: clean
    primary_key: [symbol]
    date_column: null
    sources: [project, nse]
    description: "The ETF universe: names, ISINs, AMC, index, market, creation unit size."
    columns: [
      symbol, name, isin, amc, amfi_scheme_code, underlying_index, underlying_market, currency,
      asset_class, group_label, tracked, creation_unit_size, listing_date, face_value,
      market_lot, nse_underlying_asset, nse_underlying_type, list_file_date, config_file,
      source_file,
    ]
    drop: {}
    # futures_proxy (e.g. NQ, ES) is refused by the "futures" column pattern: it only matters
    # for the fair value, which is not in the dataset.

  nav_daily:
    from: clean
    primary_key: [symbol, nav_date]
    date_column: nav_date
    sources: [amfi]
    description: "Daily NAV of each ETF as published by AMFI (not adjusted for unit splits)."
    columns: [symbol, scheme_code, nav_date, nav, nav_source, source_file]
    drop: {}

  feeder_nav_daily:
    from: clean
    primary_key: [scheme_code, nav_date]
    date_column: nav_date
    sources: [amfi]
    description: "Daily NAV of the fund-of-funds that feed four of the ETFs (R14)."
    columns: [scheme_code, fund_name, etf_symbol, nav_date, nav, source_file]
    drop: {}

  units_daily:
    from: derived_units_daily
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, project]
    description: "Units outstanding per NSE security-master file, with the change since the previous file."
    columns: [
      symbol, date, units_outstanding, units_prev, units_prev_date, days_since_prev,
      units_change, creation_unit_size, creation_units_change, creation_multiple_ok, event_type,
      source_file,
    ]
    drop: {}

  unit_events:
    from: derived_unit_events
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, project]
    description: "One row per change in units outstanding (creation or redemption)."
    columns: [
      symbol, date, prev_date, units_prev, units_new, units_change, creation_units_change,
      creation_multiple_ok, event_type, days_since_prev, source_file,
    ]
    drop: {}

  band_official:
    from: clean
    primary_key: [symbol, session_date]
    date_column: session_date
    sources: [nse]
    description: "Official daily price band of each ETF from NSE's security master."
    columns: [
      symbol, file_date, session_date, series, band_low_official, band_high_official,
      price_range_raw, source_file,
    ]
    drop: {}

  bse_prices:
    from: clean
    primary_key: [symbol, date]
    date_column: date
    sources: [bse]
    description: "Daily BSE trading of the same ETFs, matched by ISIN."
    columns: [
      symbol, date, isin, scrip_code, series, open, high, low, close, last, prev_close, volume,
      value, trades, file_format, source_file,
    ]
    drop: {}

  slb_eligible:
    from: clean
    primary_key: [date, symbol]
    date_column: date
    sources: [nse]
    description: "Whether each ETF was eligible for NSE securities lending on the sampled dates."
    columns: [date, symbol, eligible, series_count, source_file]
    drop: {}

  slb_daily:
    from: clean
    primary_key: [date, symbol, series]
    date_column: date
    sources: [nse]
    description: "NSE securities-lending trades in the ETFs."
    columns: [
      date, symbol, series, maturity, name, market_type, fee_prev_close, fee_open, fee_high,
      fee_low, fee_close, volume, value, trades, source_file,
    ]
    drop: {}

  limit_day:
    from: clean
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, amc_inav, project]
    description: "One row per ETF-day a price limit was touched, with intraday detail where 15-minute snapshots exist. Days measured on Bloomberg minute bars are removed."
    columns: [
      symbol, date, touch_basis, limit_basis, obs_source, sample_interval_min, n_obs,
      first_obs_ts, last_obs_ts, n_book_obs, touched_up, first_touch_ts_up,
      minutes_at_limit_up, minutes_at_limit_min_up, n_obs_at_limit_up, widenings_up,
      trigger_hit_up, limit_end_up, sell_qty_up_max, sell_qty_up_close, buy_qty_up_max,
      n_book_obs_up, locked_up, locked_n_obs_up, locked_close_up, touched_down,
      first_touch_ts_down, minutes_at_limit_down, minutes_at_limit_min_down,
      n_obs_at_limit_down, widenings_down, trigger_hit_down, limit_end_down, buy_qty_down_max,
      buy_qty_down_close, sell_qty_down_max, n_book_obs_down, locked_down, locked_n_obs_down,
      locked_close_down, source_file,
    ]
    drop: {}

  inav_snapshots:
    from: clean
    primary_key: [symbol, ts, source]
    date_column: ts
    sources: [amc_inav, nse]
    description: "Intraday iNAV and quote snapshots recorded by this project every 15 minutes."
    columns: [
      symbol, ts, source, last_price, inav, prev_nav, bid, ask, bid_qty, ask_qty,
      total_buy_qty, total_sell_qty, depth_json, volume, value, data_ts, amc_ts_raw,
      market_status, source_file,
    ]
    drop: {}

  units_monthly:
    from: clean
    primary_key: [symbol, month_end]
    date_column: month_end
    sources: [amc_disclosures]
    description: "Month-end AUM, NAV and units from AMC disclosures."
    columns: [symbol, month_end, aum, nav, units, source, source_file]
    drop: {}

  fof_monthly:
    from: clean
    primary_key: [amfi_scheme_code, month_end]
    date_column: month_end
    sources: [amc_disclosures]
    description: "Month-end holdings of the feeder funds-of-funds in their ETF."
    columns: [
      amfi_scheme_code, month_end, fund_name, etf_symbol, aum, etf_units_held, fof_net_flow,
      subscription_status, notice_date, source_file,
    ]
    drop: {}

  trends_daily:
    from: clean
    primary_key: [term, geo, date]
    date_column: date
    sources: [google_trends]
    description: "Google Trends search interest per term and day."
    columns: [term, geo, date, value, window_value, n_windows, source_file]
    drop: {}

  events:
    from: derived_events
    primary_key: [event_id]
    date_column: date
    sources: [project, nse]
    description: "Rule changes, exchange cautions, fund notices (written by hand) and unit-change events (derived)."
    columns: [
      event_id, date, ts_ist, type, category, direction, symbols, first_tradable_session,
      description, url, source_primary, verified, source_file,
    ]
    drop: {}
