# Open dataset export (`etfp export dataset`, src/etfp/export_dataset.py, DECISIONS D34).
#
# This file decides, table by table and column by column, what may leave the project in the
# public dataset. It is deliberately explicit:
#
# * Only the tables listed under `tables:` are exported. A new clean table is NOT exported
#   until someone adds it here.
# * Every column of an exported table must be named here: under the table's `columns`
#   (exported), its `drop` (left out for a non-licence reason) or `deny` below (left out for
#   licence reasons). A column that is in none of them stops the export with an error, so a
#   new column can never leak into the public files by default.
# * `deny` is checked again on the finished files. If a denied table, column, row or a
#   Bloomberg/Yahoo lineage path is found in the output, the export fails and the folder is
#   not written.
#
# Owner decisions (15 Nov 2026, DECISIONS D41): data licence CC BY 4.0, code MIT; the
# release carries only the project's derived columns: values published by a source (prices,
# NAVs, official bands, units, order-book quantities, search interest) go under `drop` and are
# rebuilt locally from the official sites. Uploading (Zenodo DOI) is still Amish's step.
# The export only writes a local folder under exports/dataset/ (gitignored).

dataset_format_version: "1.0.0"
title: "India-listed international ETF premiums: daily panel"

# Where the numbers come from and whether we know we may republish them.
#   own_work   = computed or written by this project (the owner picks the licence)
#   unverified = redistribution terms not checked yet; the owner must confirm before publishing
licence_status_values: [own_work, unverified]
sources:
  project:
    name: "This project (config files, hand-written events, calculations from the inputs below)"
    licence_status: own_work
    note: "Formulas, flags and config are the project's own work."
  nse:
    name: "National Stock Exchange of India (bhavcopy, UDiFF, security master price bands and units, SLB files, ETF list file, ETF iNAV API)"
    licence_status: unverified
    note: "Free public downloads from nseindia.com / nsearchives. NSE's website terms limit reproduction and commercial use; whether a cleaned derived panel may be republished is not confirmed."
  bse:
    name: "BSE Ltd (daily equity bhavcopy)"
    licence_status: unverified
    note: "Free public download from bseindia.com. Redistribution terms not checked."
  amfi:
    name: "Association of Mutual Funds in India (daily NAV files, NAV history)"
    licence_status: unverified
    note: "Free public download from amfiindia.com. Redistribution terms not checked."
  amc_inav:
    name: "Asset management company websites (intraday iNAV pages)"
    licence_status: unverified
    note: "Recorded every 15 minutes by this project; no public archive exists. Each AMC's site terms not checked."
  amc_disclosures:
    name: "AMC monthly disclosures and factsheets (AUM, fund-of-funds holdings), entered by hand"
    licence_status: unverified
    note: "Public documents; redistribution of the extracted figures not checked."
  google_trends:
    name: "Google Trends (search interest, pulled by hand)"
    licence_status: unverified
    note: "Google's terms for republishing Trends numbers not checked."

deny:
  # Sources whose data may never be in the open dataset (licence forbids redistribution).
  sources:
    bloomberg: "Bloomberg terminal licence forbids redistribution of Bloomberg data and anything derived from it (CLAUDE.md)."
    yahoo: "Yahoo Finance terms forbid redistribution; it is the free fallback for the same futures/FX inputs."
  tables:
    china_etf_daily: "Bloomberg data (R17, D31)."
    underlying_daily: "Futures closes from Bloomberg or Yahoo."
    fx_daily: "USD/INR and HKD/INR rates from Bloomberg or Yahoo."
  # Any table whose name matches one of these (case-insensitive regex) is refused.
  table_patterns: ["bloomberg", "bbg", "yahoo", "china"]
  # Columns refused in a specific table, with the reason.
  columns:
    etf_day:
      fv: "Fair value moves the NAV with Bloomberg (else Yahoo) futures and FX (SPEC 6.2)."
      fv_method: "Labels which licensed source fv used; meaningless without fv."
      fv_futures_ratio: "Bloomberg/Yahoo futures ratio."
      fv_fx_ratio: "Bloomberg/Yahoo FX ratio."
      fv_in_nav_a: "Part of the fair-value input block."
      fv_in_futures_t: "Bloomberg/Yahoo futures price."
      fv_in_futures_a: "Bloomberg/Yahoo futures price."
      fv_in_fx_t: "Bloomberg/Yahoo FX rate."
      fv_in_fx_a: "Bloomberg/Yahoo FX rate."
      fv_input_files: "Names Bloomberg/Yahoo raw files."
      fv_beta: "Beta fair value from Bloomberg/Yahoo futures (R12)."
      fv_beta_value: "Estimated from Bloomberg/Yahoo futures."
      fv_beta_se: "Estimated from Bloomberg/Yahoo futures."
      fv_beta_n: "Part of the beta estimate."
      fv_beta_method: "Part of the beta estimate."
      prem_fv: "close / fv - 1 (uses fv)."
      log_prem_fv: "ln(close / fv) (uses fv)."
      pi: "Alias of log_prem_fv (uses fv)."
      x_april_fv: "Uses fv."
      cap_pi: "ln(official upper limit / fv) (uses fv)."
      cap_pi_computed: "ln(computed upper limit / fv) (uses fv)."
      ret_fv_1: "Return of fv."
      rationed: "Defined on pi, which uses fv."
      dq_prem_fv_extreme: "Flag computed from prem_fv."
      dq_prem_fv_jump: "Flag computed from prem_fv."
      dq_fv_far_from_nav: "Flag computed from fv and futures."
  # Any column in any table whose name matches one of these (case-insensitive regex) is
  # refused, so a new fair-value or futures column is dropped even before it is listed above.
  column_patterns: ["(^|_)fv(_|$)", "futures", "bloomberg", "bbg", "yahoo", "china"]
  # Rows refused: table -> column -> values. These rows are removed, then checked again.
  rows:
    limit_day:
      obs_source: ["bloomberg_1m"]  # minutes-at-limit etc. measured on Bloomberg minute bars
  # Lineage columns (name contains "source" or ends in "_files") must not name these raw folders.
  lineage_substrings: ["bloomberg", "yahoo"]

tables:
  etf_day:
    from: clean
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, amfi, bse, amc_disclosures, project]
    description: "One row per ETF per NSE trading day: NAV timing, NAV-based premiums, returns, computed price bands and limit flags, unit changes, turnover. Source values (prices, NAVs, official bands, units) are left out (D41)."
    columns: [
      symbol, date, underlying_market, asset_class, group_label, price_adj_factor, deliv_share,
      source_file, nav_known_date, nav_known_underlying_date, nav_publication_lag_days,
      nav_t2_date, nav_t2_nav_date, nav_adj_factor, nav_same_source_file, nav_known_source_file,
      prem_raw, prem_nav_known, prem_known, prem_band_ref, x_april, regime, band_base_kind,
      band_low_initial, band_high_initial, band_low_max, band_high_max, hit_up, hit_up_max,
      last_at_up, hit_down, hit_down_max, last_at_down, widened_up, widened_down,
      widenings_min_up, widenings_min_down, close_at_upper, close_at_lower, band_file_date,
      band_session_date, band_source_file, band_mismatch, hit_up_official, hit_down_official,
      regime_inferred, regime_inferred_method, units_file_date, units_stale_days,
      units_source_file, units_source, units_change, creation_units_change, creation_event,
      creation_multiple_ok, units_change_days_since_prev, turnover_nse, turnover,
      turnover_is_nse_only, feeder_units_asof, excess_rupees, ret_close_1, ret_close_5, ret_own_1,
      ret_own_5, ret_nav_1, dq_duplicate_row, dq_negative_units, dq_missing_close,
      dq_missing_nav_known, dq_nav_stale, dq_nav_misaligned, dq_nav_same_date_missing, dq_nav_t2_missing,
      dq_units_stale, dq_units_aum_mismatch,
    ]
    drop:
      open: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      high: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      low: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      last: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      avg_price: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      prev_close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      close_raw: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      high_raw: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      low_raw: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      last_raw: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      volume: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      value: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      trades: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      deliv_qty: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      deliv_pct: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      avg_trade: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      nav_same_date: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      nav_known_at_close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      nav_known: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      nav_t2: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      nav_t1: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_base_price: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_low_official: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_high_official: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_low: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_high: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_low_diff: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      band_high_diff: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      units_outstanding: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      units: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      bse_close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      usdinr_ref: "source value (D41): FBIL reference rate, redistribution terms not checked; rebuild locally"
      bse_volume: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      bse_value: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      bse_trades: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      feeder_units: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      float_net: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      attention: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"

  etf_master:
    from: clean
    primary_key: [symbol]
    date_column: null
    sources: [project, nse]
    description: "The ETF universe: names, ISINs, AMC, index, market, creation unit size."
    columns: [
      symbol, name, isin, amc, amfi_scheme_code, underlying_index, underlying_market, currency,
      asset_class, group_label, tracked, creation_unit_size, listing_date, face_value,
      market_lot, nse_underlying_asset, nse_underlying_type, list_file_date, config_file,
      source_file,
    ]
    drop: {}
    # futures_proxy (e.g. NQ, ES) is refused by the "futures" column pattern: it only matters
    # for the fair value, which is not in the dataset.

  unit_events:
    from: derived_unit_events
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, project]
    description: "One row per change in units outstanding (creation or redemption)."
    columns: [
      symbol, date, prev_date, units_change, creation_units_change, creation_multiple_ok,
      event_type, days_since_prev, source_file,
    ]
    drop:
      units_prev: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      units_new: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"

  limit_day:
    from: clean
    primary_key: [symbol, date]
    date_column: date
    sources: [nse, amc_inav, project]
    description: "One row per ETF-day a price limit was touched, with intraday detail where 15-minute snapshots exist. Days measured on Bloomberg minute bars are removed."
    columns: [
      symbol, date, touch_basis, limit_basis, obs_source, sample_interval_min, n_obs,
      first_obs_ts, last_obs_ts, n_book_obs, touched_up, first_touch_ts_up, minutes_at_limit_up,
      minutes_at_limit_min_up, n_obs_at_limit_up, widenings_up, trigger_hit_up, n_book_obs_up,
      locked_up, locked_n_obs_up, locked_close_up, touched_down, first_touch_ts_down,
      minutes_at_limit_down, minutes_at_limit_min_down, n_obs_at_limit_down, widenings_down,
      trigger_hit_down, n_book_obs_down, locked_down, locked_n_obs_down, locked_close_down,
      source_file,
    ]
    drop:
      limit_end_up: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      limit_end_down: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      sell_qty_up_max: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      sell_qty_up_close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      buy_qty_up_max: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      buy_qty_down_max: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      buy_qty_down_close: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      sell_qty_down_max: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"

  events:
    from: derived_events
    primary_key: [event_id]
    date_column: date
    sources: [project, nse]
    description: "Rule changes, exchange cautions, fund notices (written by hand) and unit-change events (derived)."
    columns: [
      event_id, date, ts_ist, type, category, direction, symbols, first_tradable_session,
      description, url, source_primary, verified, source_file,
    ]
    drop: {}

  valve_monthly:
    from: clean
    primary_key: [symbol, month]
    date_column: null
    sources: [nse, project]
    description: "Valve status per ETF per calendar month: open (units rose), closed (data present, units never moved), redeeming_only, unknown (D33)."
    columns: [
      symbol, month, valve_status, status_rule, source, units_start_date, units_end_date,
      units_change, units_change_pct, n_obs, n_creation_days, n_redemption_days,
      n_refresh_dates, creation_unit_size, creation_units_net, all_changes_whole_cu,
      source_file,
    ]
    drop:
      units_start: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"
      units_end: "source value (D41): not republished; rebuild locally with etfp backfill + etfp build"

