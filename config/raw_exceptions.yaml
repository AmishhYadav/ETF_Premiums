# Raw files the clean step must skip, with the reason. Read by
# src/etfp/clean/common.py (skipped_raw_files).
#
# Raw files are never edited or deleted (CLAUDE.md). When a source publishes a
# file that is wrong in a way we have proved, it is listed here instead: the
# build skips it with a warning naming this entry, and the gap shows up in the
# manifest like any other missing day. Each entry needs `path` (relative to
# data/raw/) and `reason` (what is wrong and how we know).

skip:
  - path: nse_bhavcopy_full/2021-11-04/sec_bhavdata_full_04112021.csv
    reason: >-
      NSE's archive file for the 4 Nov 2021 Diwali Muhurat session is a
      byte-for-byte copy of the 3 Nov 2021 file (DATE1 = 03-Nov-2021). The
      session did happen: the 8 Nov 2021 file gives MON100 PREV_CLOSE 120.09,
      not the 3 Nov close 117.54. The real session is in NSE's old-format
      bhavcopy, saved as nse_bhavcopy_legacy/2021-11-04/cm04NOV2021bhav.csv.zip
      (TIMESTAMP 04-NOV-2021, MON100 PREVCLOSE 117.57, CLOSE 120.09); prices_daily
      takes that day from it (value_source bhavcopy_legacy; DECISIONS D54, D32).
  - path: nse_slb_eligible/2021-09-16/SLB_ELG_SEC_16092021.csv
    reason: >-
      NSE's archive serves this eligible list cut off mid-line: 290,816 bytes
      (exactly 71 x 4 KiB), last line "11846" with no fields and no final
      newline, against ~14,500 lines on 15 and 17 Sep 2021. A forced re-download
      on 14 Nov 2026 returned the same 290,816 bytes, so the defect is at the
      source, not in our transfer. Every other SLB file ends with a newline.
      The day is a gap in slb_eligible (DECISIONS D32 follow-up).
