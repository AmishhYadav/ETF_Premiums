# Price-band regimes (SPEC section 7). Parsed by etfp.config.load_rules.
#
# What a price band is
# --------------------
# Each trading day the exchange draws a band around a "base price". No trade
# may happen outside the band. The rule changed over time, so each period is a
# "regime". A new regime is a yaml edit here, not a code change.
#
# All *_pct numbers are in percent (20 means 20%).
#
# Why it matters: before Sep 2026 the base was the closing NAV from two trading
# days earlier (T-2), so the price could never stray more than 20% from a NAV
# anchor. From 7 Sep 2026 the base became the previous day's closing PRICE, so
# the band follows the market price upward day after day and premiums were
# free to climb above 200%. From 1 Apr 2027 the base is planned to return to
# the previous day's NAV.

regimes:
  - name: nav_t2
    # No start date: applies to all history before the change.
    end: 2026-09-04          # last day of the old rule (inclusive)
    base: nav_t2             # closing NAV of T-2 (two Indian trading days before the day)
    status: confirmed        # confirmed from official NSE data
    description: "Base = closing NAV of T-2. Fixed +/-20% for every asset class."
    bands:
      equity: {initial_pct: 20, step_pct: 0, max_widenings: 0}
      gold:   {initial_pct: 20, step_pct: 0, max_widenings: 0}
      silver: {initial_pct: 20, step_pct: 0, max_widenings: 0}

  - name: prev_close
    start: 2026-09-07        # 5-6 Sep 2026 are a weekend, so no regime covers them
    end: 2027-03-31
    base: prev_close
    status: confirmed        # confirmed from official NSE data
    description: >-
      Base = previous trading day's closing price. The exchange close is the
      volume-weighted average price (VWAP) of the last 30 minutes; if there
      were no such trades, the last traded price; if none, the latest NAV.
      Equity/debt ETFs start at +/-10% and widen by 5% of base after a
      cooling-off pause, at most twice per direction (so +/-20% at most).
      Gold/silver ETFs start at +/-6% and widen in 3% steps with no cap, and
      have a pre-open call auction.
    bands:
      equity:
        initial_pct: 10
        step_pct: 5
        max_widenings: 2          # per direction
        cooling_off_minutes: 15   # pause before a widening takes effect
        cooling_off_minutes_last_30: 5   # shorter pause in the last 30 minutes
        trigger_pct: 9.90         # a trade at or beyond 9.90% from base triggers a widening
        pre_open_call_auction: false
      gold:
        initial_pct: 6
        step_pct: 3
        max_widenings: null       # no cap on the number of widenings
        # cooling-off timing for gold/silver is not in the brief: left unset (VERIFY)
        pre_open_call_auction: true
      silver:
        initial_pct: 6
        step_pct: 3
        max_widenings: null
        pre_open_call_auction: true
    verify:
      - trigger_pct    # 9.90% trigger: check against the NSE circular PDF
      - gold_silver_cooling_off_minutes   # not recorded yet; check the NSE circular

  - name: nav_t1
    start: 2027-04-01
    # No end date: open-ended.
    base: nav_t1             # previous day's closing NAV
    status: planned          # NOT yet in force; the rule may change before then
    description: "Base = previous day's closing NAV. Same dynamic bands as prev_close."
    bands:
      equity:
        initial_pct: 10
        step_pct: 5
        max_widenings: 2
        cooling_off_minutes: 15
        cooling_off_minutes_last_30: 5
        trigger_pct: 9.90
        pre_open_call_auction: false
      gold:
        initial_pct: 6
        step_pct: 3
        max_widenings: null
        pre_open_call_auction: true
      silver:
        initial_pct: 6
        step_pct: 3
        max_widenings: null
        pre_open_call_auction: true
    verify:
      - gold_silver_cooling_off_minutes
      - regime   # planned only; re-check the circular before 1 Apr 2027

# Smallest price step on the exchange (rupees).
tick_size: 0.01

# Band limits are snapped to the tick: the low limit is rounded UP and the high
# limit DOWN, so a limit never lies outside the true percentage band.
# Observed in official NSE data on 2026-11-09: base 229.67 gives 206.71 - 252.63
# (229.67 x 0.9 = 206.703 -> 206.71 ; 229.67 x 1.1 = 252.637 -> 252.63).
rounding:
  band_low: up
  band_high: down
  verify:
    - rounding   # one observed day only

# A close within this fraction (0.001 = 0.1%) of a band limit counts as "at the limit".
at_band_tolerance: 0.001

sources:
  - "SEBI circular HO/47/11/11(1)2026-MRD-POD3/I/13804/2026 (15 Jun 2026)"
  - "SEBI extension circular of 28 Aug 2026"
  - "NSE circular 122/2026 (1 Sep 2026)"
