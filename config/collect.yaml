# Settings for the intraday snapshot recorder and for polite web requests.
# Parsed by etfp.config.load_collect_settings. Times MUST be quoted strings
# (an unquoted 15:30 can be misread by yaml as a number).

inav:
  # iNAV = the indicative NAV an ETF publishes during the trading day (a live
  # estimate of what its holdings are worth). We record it, with the market
  # price and order-book depth, every `every_minutes` between start and end.
  start: "09:15"          # NSE opens
  end: "15:30"            # NSE closes; the 15:30 snapshot is included
  every_minutes: 15
  post_close: "15:45"     # one extra snapshot after the close
  timezone: "Asia/Kolkata"
  # The recorder writes a heartbeat file each run; a heartbeat older than this
  # means the recorder has stopped and an alert should fire.
  heartbeat_stale_minutes: 20

http:
  # Project rule: at least 1 second between NSE calls. 1.5 leaves margin.
  nse_min_interval_s: 1.5
  default_interval_s: 0.5   # other sources (AMFI, Yahoo, ...)
  max_retries: 3            # with exponential backoff

# NSE order-book depth (total buy/sell quantity, bid/ask levels) and iNAV from NSE's own
# quote page, through a real browser (DECISIONS D12). Needs the optional extra:
#   uv sync --extra inav && uv run playwright install chromium
# It runs after the other sources in each tick; if it fails the other sources are unaffected.
nse_quote:
  enabled: false          # OFF until a supervised capture works (D31). auto = on when Playwright is installed; true = always; false = off
  headless: true
  channel: null           # null = Playwright's own headless browser; "chromium" = full browser, new headless mode
  browser_executable: null  # path of a browser program to use instead of Playwright's
  page_gap_s: 1.5         # pause between two page loads (project rule: at least 1.5)
  wait_s: 15              # longest wait for one page's own answers
  launch_timeout_s: 30
  tick_budget_s: 240      # stop starting new pages after this long, so the next tick is never late
