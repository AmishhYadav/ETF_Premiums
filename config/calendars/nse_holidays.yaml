# NSE calendar overrides, read by src/etfp/calendars.py.
#
# Why this file exists
# --------------------
# The calendar library (exchange_calendars) has no NSE calendar of its own; we
# borrow the BSE one, which shares holidays with NSE. Two problems follow:
#   1. The library only knows Indian holidays up to the end of 2026.
#   2. If NSE ever closes or opens on a day the library does not expect, we
#      must be able to correct it without touching code.
# Wrong holidays shift "T-2" (the price-band base day) and "previous session"
# (which NAV is stale), so keep this file honest.
#
# Every entry needs a `reason`, so the next reader knows where it came from.

# Dates the library thinks are trading days but NSE was shut (applies at any date).
# Example:
#   - {date: 2026-12-25, reason: "Unscheduled closure, NSE circular XYZ/2026"}
extra_holidays: []

# Dates the library thinks are closed but NSE traded (for example a special
# Saturday session). Applies at any date.
# Example:
#   - {date: 2026-02-28, reason: "Special Saturday session, NSE circular XYZ/2026"}
#
# Diwali "Muhurat" trading: a short evening session (about one hour) on the
# Diwali holiday or a Sunday. It is a real session: NSE publishes a bhavcopy and
# a security master for it, and the next day's PREV_CLOSE and price band are
# based on its close (seen 9 Nov 2026: PREV_CLOSE 231.90 for MONQ50 = Muhurat
# close, not the 6 Nov close 227.58). Existence of each date confirmed on
# 2026-11-14 by HTTP 200 for NSE's full bhavcopy (DECISIONS D24). The calendar
# stores the normal 09:15-15:30 times for these days; the real session was in
# the evening (exact times VERIFY from the NSE circular of each year).
extra_sessions:
  - {date: 2021-11-04, reason: "Diwali Muhurat session (bhavcopy HTTP 200, D24)"}
  - {date: 2022-10-24, reason: "Diwali Muhurat session (bhavcopy HTTP 200, D24)"}
  - {date: 2023-11-12, reason: "Diwali Muhurat session, Sunday (bhavcopy HTTP 200, D24)"}
  - {date: 2024-11-01, reason: "Diwali Muhurat session (bhavcopy HTTP 200, D24)"}
  - {date: 2025-10-21, reason: "Diwali Muhurat session (bhavcopy HTTP 200, D24)"}
  - {date: 2026-11-08, reason: "Diwali Muhurat session, Sunday (UDiFF + security master HTTP 200, D24)"}

# Holidays for years BEYOND the library's recorded range (2027 onwards), as
# year -> list of dates (weekday holidays only matter; weekends are already
# closed). A plain date or {date: ..., reason: ...} both work.
#
# If a year is absent here, every Monday-Friday of that year is treated as a
# trading day and the calendar reports it as "provisional". That is deliberate:
# the live recorder would rather run on a holiday than miss a trading day.
#
# 2027: VERIFY. Fill this in from the NSE trading-holiday circular for 2027
# once NSE publishes it (usually in December of the previous year), then log it
# in docs/DECISIONS.md. Expected format (these dates are placeholders, NOT real):
#
# holidays:
#   2027:
#     - 2027-01-26   # Republic Day (example)
#     - {date: 2027-03-26, reason: "Holi (example)"}
holidays: {}
