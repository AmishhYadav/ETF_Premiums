[project]
name = "etfp"
version = "0.1.0"
license = "MIT"
description = "ETF premium tracker: data pipeline for India-listed international ETFs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "exchange-calendars>=4.5",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
inav = ["playwright>=1.45"]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
etfp = "etfp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etfp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# paper/ holds frozen analysis scripts from the research drafts (not pipeline code).
extend-exclude = ["paper"]

[tool.ruff.lint]
# DTZ = flag naive datetimes (project rule: every timestamp is timezone-aware)
select = ["E", "F", "I", "UP", "B", "DTZ", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
